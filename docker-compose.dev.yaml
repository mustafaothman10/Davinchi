name: core-services-davinchi-dev

services:
  postgres:
    image: postgres:17.11
    container_name: core-services-davinchi-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - core-services-davinchi-dev-network

# MongoDB Database for Development
  mongodb:
    image: mongo:7-jammy
    container_name: core-services-davinchi-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: core_service_db
    ports:
      - '27017:27017'
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - core-services-davinchi-dev-network

  # MongoDB Replica Set Initialization
  mongodb-init:
    image: mongo:7-jammy
    container_name: core-services-davinchi-mongodb-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh --host mongodb:27017 --eval 
      "
      try {
        rs.status();
        print('Replica set already initialized');
      } catch(e) {
        rs.initiate({
          _id: 'rs0',
          members: [{ _id: 0, host: 'mongodb:27017' }]
        });
        print('Replica set initialized');
      }
      "
    networks:
      - core-services-davinchi-dev-network

volumes:
  postgres_dev_data:
  mongodb_dev_data:

networks:
  core-services-davinchi-dev-network:
    driver: bridge
